# $schema=https://www.schemastore.org/github-action.json
name: "Build single melange package"
description: "Builds a single package using melange"

inputs:
  melange-config-file:
    description: "Path to melange config file"
    required: true
    default: "melange.yaml"
  build-arch:
    description: "The architecture(s) to build the package for (comma separated)"
    required: true
    default: "x86_64"
  cache-dir:
    description: "The directory to store build cache files in"
    required: true
    default: "./.cache/"
  out-dir:
    description: "The directory to output built packages into"
    required: true
    default: "./packages/"
  signing-key:
    description: "The private key used to sign the built packages (PEM format)"
    required: false
    default: ""
  signing-key-name:
    description: "The name of the key used to sign the built packages (not including the .rsa/.rsa.pub suffix)"
    required: false
    default: ""
  package-namespace:
    description: "namespace to use in package URLs in SBOM (eg wolfi, alpine) (default 'unknown')"
    required: true
    default: "unknown"
  generate-index:
    description: "generate APKINDEX.tar.gz"
    required: false
    default: "true"
  generate-provenance:
    description: "generate SLSA provenance for builds (included in a separate .attest.tar.gz file next to the APK)"
    required: false
    default: "true"

runs:
  using: "composite"

  steps:
    - name: Get package info
      id: pkg-info
      uses: rbrownwsws/get-melange-package-info@3bbdcad7aafc515f2aef9e26340dbeafd0fbf84b

    - name: Cache - Restore build deps
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ steps.pkg-info.outputs.package-name }}-${{ steps.pkg-info.outputs.package-version }}-r${{ steps.pkg-info.outputs.package-epoch }}
        restore-keys: |
          ${{ steps.pkg-info.outputs.package-name }}-${{ steps.pkg-info.outputs.package-version }}-
          ${{ steps.pkg-info.outputs.package-name }}-

    - name: Build package
      shell: bash
      env:
        CACHE_DIR: "${{ inputs.cache-dir }}"
        OUT_DIR: "${{ inputs.out-dir }}"
        ARCH:  "${{ inputs.build-arch }}"
        SIGNING_KEY: "${{ inputs.signing-key }}"
        SIGNING_KEY_NAME: "${{ inputs.signing-key-name }}"
        MELANGE_CONFIG_FILE: "${{ inputs.melange-config-file }}"
        GENERATE_INDEX: "${{ inputs.generate-index }}"
        GENERATE_PROVENANCE: "${{ inputs.generate-provenance }}"
      run: |
        set -euo pipefail

        chmod +x "${GITHUB_ACTION_PATH}/build-package.sh"
        "${GITHUB_ACTION_PATH}/build-package.sh"

    - name: Cache - Save build deps
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ steps.pkg-info.outputs.package-name }}-${{ steps.pkg-info.outputs.package-version }}-r${{ steps.pkg-info.outputs.package-epoch }}
